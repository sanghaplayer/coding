<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        width: 200px;
        height: 500px;
        background-color: blue;
        animation: test 0.1s ease-in-out infinite alternate;
        /* transform: translate(300px,300px,); */
    }
    @keyframes test{
        0%{
            transform: rotate(0);
        }
        100%{
            transform: rotate(360deg);
        }
    }

</style>
<body>
    <div class="box"></div>
    
</body>
</html>
