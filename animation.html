<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .boss{
         /* width: 100%; */
         height: 100px;
         background-color: blue;
         animation: test 10s ease-in-out infinite alternate;


    }
    @keyframes test{
        0%{
            transform: scale(0px);
        }
        100%{
            transform: scale(500px);
        }
    }
</style>

<body>
    <div class="boss"></div>
</body>
